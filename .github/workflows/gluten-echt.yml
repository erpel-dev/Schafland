# Misst die Gluten-Erkennung für gescannte Produkte mit echten Daten von Open Food Facts.
name: Gluten (echte Daten)

on:
  push:
    branches: [gluten-zutaten, gluten-ohne]
    paths: ["src/lib/gluten.js", "tests/gluten/**", ".github/workflows/gluten-echt.yml"]
  workflow_dispatch:

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Messen
        run: node tests/gluten/echt.mjs
