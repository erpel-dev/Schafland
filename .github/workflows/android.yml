# Baut die Android-APK für Tablets (Capacitor) und stellt sie als Download bereit:
# GitHub → Actions → „Android-APK“ → letzter Lauf → Artifacts → schafland-apk
name: Android-APK

on:
  push:
    branches: [main, android-apk, frag-das-schaf, nfc-karte]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: ok=; for i in 1 2 3; do npm ci && ok=1 && break; echo "npm ci fehlgeschlagen, neuer Versuch"; sleep 15; done; [ -n "$ok" ]

      - name: Unit-Tests
        run: npm test

      - name: App bauen und ins Android-Projekt kopieren
        run: |
          npx vite build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Das Android-SDK ist auf den GitHub-Rechnern vorinstalliert ($ANDROID_HOME)

      - name: Signaturschlüssel aus den Secrets (falls hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHAFLAND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/schafland.jks"
            echo "SCHAFLAND_KEYSTORE=$RUNNER_TEMP/schafland.jks" >> "$GITHUB_ENV"
            echo "Signiert mit dem Schafland-Schlüssel"
          else
            echo "::warning::Kein Secret SCHAFLAND_KEYSTORE_BASE64: APK mit Testschlüssel signiert. Für Updates muss die alte App erst deinstalliert werden (siehe README)."
          fi

      - name: APK bauen
        working-directory: android
        env:
          SCHAFLAND_KEYSTORE_PASSWORD: ${{ secrets.SCHAFLAND_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: APK benennen
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/schafland-$V.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: schafland-apk
          path: out/*.apk
          retention-days: 60

      # Debug-APK nur für den Emulator-Test (erlaubt die Fernsteuerung der WebView)
      - uses: actions/upload-artifact@v4
        with:
          name: schafland-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Startet die APK im Android-Emulator und bedient sie (android/ci/smoke.mjs)
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tablet
            profile: pixel_tablet
          - name: Handy
            profile: pixel_7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: schafland-debug-apk
          path: apk

      - name: Bildverkleinerung für die Screenshots
        run: pip install --quiet pillow

      - name: KVM für den Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App im Emulator testen (${{ matrix.name }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Android ohne Google-Play-Dienste: Die stürzen im überlasteten Emulator ständig ab und
          # Android beendet dabei jede App mit, die eine WebView zeigt (auch Chrome).
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back emulated -camera-front emulated
          script: android/ci/smoke.sh apk/app-debug.apk ${{ matrix.name }}
