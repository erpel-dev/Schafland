# Baut alle Schafland-Dateien und hängt sie an ein GitHub-Release.
# Auslösen: Version in package.json erhöhen und nach main pushen. Gibt es zu dieser Version
# noch kein Release, legt der Lauf es samt Tag (v<version>) an. Ein gepushter Tag v* geht auch.
name: Release

on:
  push:
    branches: [main]
    paths: ["package.json", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v1.11.0 (muss existieren)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version prüfen
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$V" ]; then
            echo "::error::Tag ${{ github.ref_name }} passt nicht zur Version $V in package.json"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.event_name }}" = "push" ] && gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V gibt es schon – nichts zu tun."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Abhängigkeiten und Tests
        if: steps.v.outputs.skip != '1'
        run: |
          ok=; for i in 1 2 3; do npm ci && ok=1 && break; echo "npm ci fehlgeschlagen, neuer Versuch"; sleep 15; done; [ -n "$ok" ]
          npm test

      - name: App bauen
        if: steps.v.outputs.skip != '1'
        run: npx vite build

      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip != '1'
        with:
          go-version-file: launcher/go.mod
          cache: false

      - name: Windows- und Linux-Starter bauen
        if: steps.v.outputs.skip != '1'
        run: |
          (cd launcher && go test ./...)
          node scripts/build-starter.mjs

      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != '1'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Signaturschlüssel aus den Secrets (falls hinterlegt)
        if: steps.v.outputs.skip != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.SCHAFLAND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/schafland.jks"
            echo "SCHAFLAND_KEYSTORE=$RUNNER_TEMP/schafland.jks" >> "$GITHUB_ENV"
            echo "SIGNIERT=ja" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Secret SCHAFLAND_KEYSTORE_BASE64: APK mit Testschlüssel signiert."
            echo "SIGNIERT=nein" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        if: steps.v.outputs.skip != '1'
        env:
          SCHAFLAND_KEYSTORE_PASSWORD: ${{ secrets.SCHAFLAND_KEYSTORE_PASSWORD }}
        run: |
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Dateien zusammenstellen
        if: steps.v.outputs.skip != '1'
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/schafland-$V.apk"
          cp release/schafland.exe "out/schafland-$V-windows.exe"
          cp release/schafland "out/schafland-$V-linux"
          (cd dist && zip -qr "../out/schafland-$V-web.zip" .)
          cp docs/zusammenfassung.html "out/schafland-$V-uebersicht.html"
          cp docs/etiketten-beispiel.pdf "out/schafland-$V-etiketten-beispiel.pdf"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out

      - name: Release-Text
        if: steps.v.outputs.skip != '1'
        run: |
          if [ "$SIGNIERT" = "nein" ]; then
            SIGN="Die APK ist mit einem Test-Schlüssel signiert: Vor einem Update die alte App deinstallieren (gescannte Produkte und Einstellungen gehen dabei verloren). Mit eigenem Schlüssel als GitHub-Secret entfällt das (siehe README)."
          else
            SIGN="Die APK ist mit dem Schafland-Schlüssel signiert und lässt sich über frühere Versionen installieren."
          fi
          cat > notes.md <<EOF
          Schafland $V – Spiel-Kasse für den Kinderkaufladen.

          | Datei | Für |
          | --- | --- |
          | \`schafland-$V.apk\` | Android-Tablets und -Smartphones (Android 7 oder neuer): auf das Gerät kopieren und antippen |
          | \`schafland-$V-windows.exe\` | Windows 10/11: doppelklicken. Braucht Edge oder Chrome (bei Windows dabei) |
          | \`schafland-$V-linux\` | Linux (64 Bit): ausführbar machen (\`chmod +x\`) und starten. Braucht Chromium oder Chrome |
          | \`schafland-$V-web.zip\` | Web-Version zum Selbst-Hosten (beliebiger Webserver, HTTPS oder localhost wegen der Kamera) |
          | \`schafland-$V-uebersicht.html\` | Übersicht mit Screenshots |
          | \`schafland-$V-etiketten-beispiel.pdf\` | Beispiel für gedruckte Preis-Etiketten |
          | \`SHA256SUMS.txt\` | Prüfsummen |

          $SIGN

          Beim allerersten Start auf Android zeigt das System einmal „Vollbildmodus – zum Beenden von oben wischen“: einmal mit OK bestätigen.
          EOF
          sed -i 's/^          //' notes.md
          cat notes.md

      - name: Release anlegen
        if: steps.v.outputs.skip != '1'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" out/* --target "$(git rev-parse HEAD)" --title "Schafland $V" --notes-file notes.md
          fi
